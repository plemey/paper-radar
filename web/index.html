<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paper Radar</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0f1115" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Paper Radar</h1>
    <div class="topbar-actions">
      <button id="refreshBtn" title="Refresh">⟳</button>
      <button id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <nav class="filters" id="sourceFilters">
    <button class="chip active" data-source="all">All</button>
    <button class="chip" data-source="pubmed">PubMed</button>
    <button class="chip" data-source="arxiv">arXiv</button>
    <button class="chip" data-source="biorxiv">bioRxiv</button>
    <button class="chip" data-source="medrxiv">medRxiv</button>
  </nav>

  <main id="feed" class="feed">
    <p class="empty-state" id="emptyState">Loading your feed…</p>
  </main>

  <!-- Settings modal -->
  <dialog id="settingsModal">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>

      <label>GitHub owner (username)
        <input type="text" id="ghOwner" placeholder="e.g. plemey" required />
      </label>
      <label>Repo name
        <input type="text" id="ghRepo" placeholder="e.g. paper-radar" required />
      </label>
      <label>Branch
        <input type="text" id="ghBranch" value="main" />
      </label>
      <label>Personal access token (Contents: read/write, this repo only)
        <input type="password" id="ghToken" placeholder="github_pat_…" required />
      </label>
      <p class="hint">Stored only in this browser's local storage. Never sent anywhere except
        GitHub's API.</p>

      <hr />

      <h2>Seed from your .bib library</h2>
      <label>Upload a .bib file
        <input type="file" id="bibFile" accept=".bib" />
      </label>
      <p class="hint" id="bibStatus"></p>

      <div class="modal-actions">
        <button type="button" id="saveSettingsBtn" class="primary">Save</button>
        <button type="button" id="closeSettingsBtn">Close</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <span class="badge"></span>
        <span class="score"></span>
      </div>
      <h3 class="title"></h3>
      <p class="meta"></p>
      <p class="abstract"></p>
      <div class="card-actions">
        <button class="btn down" title="Not interested">👎</button>
        <a class="btn open" target="_blank" rel="noopener">Open ↗</a>
        <button class="btn up" title="Interesting">👍</button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
