# Edit these keywords to match your interests. They are OR'd together for retrieval;
# ranking within the feed is driven by the learned preference vector, not these keywords,
# so it's fine to keep this list broad and a little redundant.
keywords:
  - "phylodynamics"
  - "viral phylogeography"
  - "Bayesian phylogenetics"
  - "molecular epidemiology virus"
  - "protein structure evolution"
  - "ancient DNA virus"
  - "BEAST phylogenetics"
  - "antigenic cartography"

sources: [pubmed, arxiv, biorxiv, medrxiv]

# Only used for arXiv (bioRxiv/medRxiv use their own subject taxonomy, applied automatically
# for the biology/medicine categories closest to virus/evolution work).
arxiv_categories: [q-bio.PE, q-bio.GN, q-bio.BM]

max_per_source_per_day: 60
feed_size: 200

# PubMed E-utilities requires an email/tool identifier (no API key needed for low volume,
# but recommended if you have one, to raise your rate limit from 3/sec to 10/sec).
pubmed_email: "you@example.com"
pubmed_api_key: ""   # optional, from https://www.ncbi.nlm.nih.gov/account/settings/
