name: Update preferences

on:
  push:
    paths:
      - "data/ratings.json"
      - "data/seed.bib"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-radar-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and sentence-transformers model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/huggingface
          key: paper-radar-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Import bib seed (if changed)
        run: python scripts/import_bib.py

      - name: Recompute preference vector
        run: python scripts/update_preferences.py

      - name: Re-score existing feed against new preference vector
        run: python scripts/rescore_feed.py

      - name: Commit results
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update preference vector"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi
