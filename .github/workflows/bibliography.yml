name: Rebuild bibliography

on:
  push:
    branches: [main]
    paths:
      - data/ratings.json
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: paper-radar-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build bibliography
        run: python scripts/build_bibliography.py

      - name: Commit bibliography
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@github.com"
          git add data/bibliography.bib
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update bibliography.bib"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi
