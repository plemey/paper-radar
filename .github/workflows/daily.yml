name: Daily fetch

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = midnight CEST (Belgium summer time); shifts to 1am during CET (winter)
  workflow_dispatch: {}    # lets you trigger manually from the Actions tab

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-radar-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and sentence-transformers model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/torch
            ~/.cache/huggingface
          key: paper-radar-${{ runner.os }}-${{ hashFiles('scripts/requirements.txt') }}

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and score new papers
        id: fetch
        run: python scripts/fetch_and_score.py

      - name: Commit results
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Daily fetch: $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 10 + 5))
            done
          fi

      - name: Notify via GitHub issue (triggers email through GitHub notifications)
        if: steps.fetch.outputs.new_paper_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.fetch.outputs.new_paper_count }}
        run: |
          gh label create daily-digest --repo "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "Automated daily new-papers notification" 2>/dev/null || true

          # Close any still-open digest from a previous day so these don't pile up.
          gh issue list --repo "$GITHUB_REPOSITORY" --label daily-digest --state open --json number -q '.[].number' \
            | xargs -r -n1 -I{} gh issue close {} --repo "$GITHUB_REPOSITORY" --comment "Superseded by today's digest."

          PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🧪 $COUNT new paper(s) to rate — $(date -u +%Y-%m-%d)" \
            --body "$COUNT new paper(s) landed in your feed today.

          👉 Rate them: $PAGES_URL

          (Close this issue once you're done — it'll be superseded automatically by tomorrow's digest either way.)" \
            --label daily-digest \
            --assignee "$GITHUB_REPOSITORY_OWNER"
